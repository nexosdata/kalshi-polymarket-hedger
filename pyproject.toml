[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-polymarket-hedger"
version = "1.0.0"
description = "Production-grade cross-venue prediction market delta hedging and risk management engine for Kalshi and Polymarket"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "NaxosData Contributors & William Gonda", email = "research@naxosdata.com" }
]
keywords = [
    "kalshi polymarket hedging",
    "prediction market delta hedging",
    "kalshi risk management",
    "cross venue prediction arbitrage",
    "kalshi portfolio hedge",
    "polymarket",
    "kalshi",
    "quantitative-finance",
    "cftc",
    "basis-risk",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
kalshi-hedger = "hedger.cli:main"
pm-hedger = "hedger.cli:main"

[project.urls]
Homepage = "https://naxosdata.com"
Documentation = "https://github.com/nexosdata/kalshi-polymarket-hedger#readme"
Repository = "https://github.com/nexosdata/kalshi-polymarket-hedger"
